<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Resolucion de ejercicios sobre validaciones de formularios</title>
    </head>
    <body>
        <h2>Formulario de registro</h2>
        <form id="form-registro">
            <input type="text" id="nombre" placeholder="Nombre">
            <input type="text" id="correo" placeholder="Correo electrónico">
            <input type="number" id="edad" placeholder="Edad">
            <br>
            <label><input type="radio" name="genero" value="masculino"> Masculino</label>
            <label><input type="radio" name="genero" value="femenino"> Femenino</label>
            <br>
            <label><input type="checkbox" id="terminos"> Acepto los términos</label>
            <br>
            <button type="submit">Registrarse</button>
        </form>
        <div id="contenedorErrores"></div>
        <div id="resultado"></div>

        <script src="dia14-js-validacion.js"></script>
    </body>
</html>
