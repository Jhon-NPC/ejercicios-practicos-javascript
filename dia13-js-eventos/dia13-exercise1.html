<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Resolución de ejercicios sobre eventos</title>
    </head>
    <body>
        <h1 id="titulo">Panel de pruebas</h1>
        <p id="contador">0</p>
        <button id="btnSumar">Sumar</button>
        <button id="btnRestar">Restar</button>

        <div id="caja">Pasa el mouse por aquí</div>

        <input type="text" id="campoTexto" placeholder="Escribe algo...">
        <p id="vistaPrevia"></p>

        <select id="selectorColor">
            <option value="">-- elige un color --</option>
            <option value="red">Rojo</option>
            <option value="green">Verde</option>
            <option value="blue">Azul</option>
        </select>

        <form id="miFormulario">
            <input type="text" id="campoFormulario" placeholder="Tu nombre" required>
            <button type="submit">Enviar</button>
        </form>
        <p id="mensajeFormulario"></p>
        
        <button id="btnUnaVez">Solo funciona una vez</button>

        <script src="dia13-eventos-exercise1.js"></script>
    </body>
